# ─────────────────────────────────────────────────────────────────────────────
# deploy.yml
#
# Triggered on:
#   1. Push to main in THIS repo (engine changes)
#   2. repository_dispatch event with type "content-updated"
#      — sent by the content repo's GitHub Action when you push new docs
#
# What it does:
#   1. Checks out this engine repo
#   2. Checks out the CONTENT repo into src/content/docs/
#      (so Starlight picks it up automatically)
#   3. Runs `astro build` (TypeScript-checked, static output → dist/)
#   4. Deploys dist/ to GitHub Pages
# ─────────────────────────────────────────────────────────────────────────────
name: Build & Deploy Docs

on:
  push:
    branches: [main]

  # Triggered by the content repo via Repository Dispatch
  repository_dispatch:
    types: [content-updated]

  # Allow manual run from GitHub Actions UI
  workflow_dispatch:

# Security: minimal permissions
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel any in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Full history needed for lastUpdated dates

      # ── Pull content from the separate content repo ───────────────────────
      - name: Clone content repo into docs folder
        run: |
          # Clear placeholder — keep .gitkeep so git doesn't drop the empty dir
          rm -rf src/content/docs/*

          # Shallow clone the content repo (fast — no full history needed)
          git clone \
            --depth=1 \
            --single-branch \
            --branch main \
            "${{ secrets.CONTENT_REPO_URL }}" \
            _content_tmp

          # Copy every feature folder into the docs directory
          # Excludes hidden files (.git, .github) and any root-level non-folder files
          find _content_tmp -mindepth 1 -maxdepth 1 -type d | while read dir; do
            cp -r "$dir" src/content/docs/
          done

          # Clean up temp clone
          rm -rf _content_tmp

          echo "✅ Content synced:"
          ls -la src/content/docs/

      # ── Node.js + cache ───────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GITHUB_REPO_URL: ${{ vars.GITHUB_REPO_URL }}
          CONTENT_REPO_EDIT_URL: ${{ vars.CONTENT_REPO_EDIT_URL }}

      # ── Upload artifact for GitHub Pages ─────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
